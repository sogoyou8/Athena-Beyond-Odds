name: Rapport de bug
description: Signalez un problème ou un comportement inattendu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un bug. Veuillez remplir les sections ci-dessous.
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Un résumé clair et concis du bug.
      placeholder: Quel est le problème ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      description: Expliquez comment nous pouvons reproduire le comportement inattendu.
      placeholder: |
        1. Allez sur '...'
        2. Cliquez sur '...'
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous vous attendiez à voir se produire.
      placeholder: Quel aurait dû être le résultat correct ?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou captures d'écran
      description: Ajoutez des captures d'écran ou des messages d'erreur si disponible.
